name: Build and test iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: python3 scripts/generate_project.py
      - name: Check project format
        run: plutil -lint PanelReader.xcodeproj/project.pbxproj
      - name: Build and run library tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p build
          PANEL_SIMULATOR_ID=$(python3 scripts/choose_simulator.py)
          xcodebuild test \
            -project PanelReader.xcodeproj \
            -scheme PanelReader \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PANEL_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: build/TestResults.xcresult
          retention-days: 5
          if-no-files-found: ignore
